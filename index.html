<div class="modal-overlay" id="checkout-modal"><div class="modal-sheet"><h3 id="checkout-title">Beli</h3><input id="checkout-target-number" class="form-input" placeholder="0812..." value="081298765432" /><div id="checkout-nominals-list"></div><select id="checkout-payment-method" class="form-input"><option value="balance">Saldo Utama</option></select><button id="btn-confirm-transaction" class="btn-primary">Bayar REAL</button><button id="close-checkout-modal">Tutup</button></div></div>
<div class="modal-overlay" id="topup-modal"><div class="modal-sheet"><h3>Isi Saldo</h3><div id="topup-nominals"><button class="nominal-btn selected" data-amt="50000">Rp 50.000</button><button class="nominal-btn" data-amt="100000">Rp 100.000</button><button class="nominal-btn" data-amt="250000">Rp 250.000</button><button class="nominal-btn" data-amt="500000">Rp 500.000</button></div><button id="btn-submit-topup" class="btn-primary">Isi Saldo REAL</button><button id="close-topup-modal">Tutup</button></div></div>
<div class="modal-overlay" id="transfer-modal"><div class="modal-sheet"><h3>Transfer</h3><input id="transfer-target-id" placeholder="IF000088" class="form-input" /><input id="transfer-amount" type="number" value="50000" class="form-input" /><button id="btn-submit-transfer" class="btn-primary">Kirim REAL</button><button id="close-transfer-modal">Tutup</button></div></div>
<div class="toast-msg" id="app-toast"><span id="toast-text">Berhasil!</span></div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

// --- SUPABASE REAL ---
const SUPA_URL = 'https://uodyquxmujmgiwfatkeh.supabase.co';
let SUPA_KEY = localStorage.getItem('sb_publishable_key');
if(!SUPA_KEY){
  let k = prompt('Paste Publishable Key sb_publishable_... (sekali aja dari Supabase Data API)');
  if(k){ localStorage.setItem('sb_publishable_key', k); SUPA_KEY=k; }
}
const USER_ID = 'IF000004';
const supabase = createClient(SUPA_URL, SUPA_KEY);

// --- DATA ASLI LU ---
const APP_DATA = {
  wallet:{balance:10069069,bonus:1525000},
  quick_access:[
    {id:"pulsa",name:"Pulsa",icon:"phone",color:"#0a84ff"},
    {id:"telkomsel_promo",name:"Telkomsel",badge:"Promo",icon:"flame",color:"#E82A2A"},
    {id:"token_pln",name:"Token PLN",icon:"zap",color:"#FFB800"},
    {id:"pln_tagihan",name:"PLN Tagihan",icon:"receipt",color:"#00C2FF"}
  ],
  categories:{
    items:[
      {id:"promo",name:"*Promo",icon:"tag",color:"#FF4757"},
      {id:"isi_ulang",name:"Isi Ulang",icon:"smartphone",color:"#0a84ff"},
      {id:"aktivasi_paket",name:"Aktivasi Paket Perdana & Voc. Kosong",icon:"sim-card",color:"#2ED573"},
      {id:"voucher_tv",name:"Voucher TV",icon:"tv",color:"#FFA502"},
      {id:"topup_games",name:"Topup Games",icon:"gamepad-2",color:"#9B59B6"},
      {id:"token",name:"Token",icon:"bolt",color:"#ECCC68"},
      {id:"tagihan",name:"Tagihan",icon:"file-text",color:"#70A1FF"},
      {id:"pdam",name:"PDAM",icon:"droplet",color:"#1E90FF"},
      {id:"bpjs",name:"BPJS",icon:"shield",color:"#2ED573"},
      {id:"ewallet",name:"E-Wallet",icon:"wallet",color:"#FF6348"},
      {id:"voucher_lain",name:"Voucher Lain",icon:"gift",color:"#FD79A8"},
      {id:"lainnya",name:"Lainnya",icon:"grid",color:"#A4B0BE"}
    ]
  }
};

let userBalance = 0;
let isBalanceHidden=false;
let activeService=null;
let selectedNominal=null;
let transactionLogs=[];

function formatRupiah(n){return "Rp "+Number(n).toLocaleString("id-ID");}
function showToast(msg){const t=document.getElementById("app-toast");document.getElementById("toast-text").textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),3000);}
function getSvgIcon(){return "📱";}

async function loadSaldoREAL(){
  try{
    let {data,error} = await supabase.from('users').select('saldo').eq('id',USER_ID).maybeSingle();
    if(error) throw error;
    if(!data){ await supabase.from('users').insert({id:USER_ID,saldo:10069069}); data={saldo:10069069}; }
    userBalance=Number(data.saldo);
    document.getElementById('wallet-balance-display').textContent=formatRupiah(userBalance);
    document.getElementById('supa-status').textContent='REAL ✅ Rp '+userBalance.toLocaleString('id-ID');
    document.getElementById('supa-status').style.background='#00c853';
    // load transaksi
    let {data:trx} = await supabase.from('transaksi').select('*').eq('user_id',USER_ID).order('created_at',{ascending:false}).limit(20);
    if(trx && trx.length>0){
      transactionLogs=trx.map(x=>({title:x.keterangan,desc:x.jenis,amount:x.jumlah,date:new Date(x.created_at).toLocaleString(),type:x.jumlah>0?'plus':'minus'}));
      renderHistory();
    }
    showToast('REAL Supabase Connected 💙 Rp '+userBalance.toLocaleString('id-ID'));
  }catch(e){
    document.getElementById('wallet-balance-display').textContent='Error: '+e.message;
    document.getElementById('supa-status').textContent='OFFLINE';
    showToast('Error: '+e.message);
  }
}

function renderQuickAccess(){
  const c=document.getElementById("quick-access-container"); c.innerHTML="";
  APP_DATA.quick_access.forEach(item=>{
    const card=document.createElement("div"); card.className="quick-card"; card.style.cssText="background:#0f2342;border:1px solid #1a3a6a;border-radius:16px;padding:14px;text-align:center;cursor:pointer";
    card.innerHTML=`${item.badge?`<span style="background:#0a84ff;color:#fff;padding:2px 6px;border-radius:10px;font-size:10px">${item.badge}</span>`:''}<div style="font-size:22px;color:${item.color}">●</div><span>${item.name}</span>`;
    card.onclick=()=>openCheckoutModal(item.name,item.id);
    c.appendChild(card);
  });
}
function renderCategories(){
  const c=document.getElementById("category-grid-container"); c.innerHTML="";
  APP_DATA.categories.items.forEach(item=>{
    const cat=document.createElement("div"); cat.className="category-item"; cat.style.cssText="background:#0f2342;border:1px solid #1a3a6a;border-radius:16px;padding:12px;text-align:center;cursor:pointer";
    cat.innerHTML=`<div style="color:${item.color};font-size:20px">●</div><span style="font-size:11px">${item.name}</span>`;
    cat.onclick=()=>openCheckoutModal(item.name,item.id);
    c.appendChild(cat);
  });
}
function renderHistory(){
  const container=document.getElementById("history-list-container"); container.innerHTML="";
  transactionLogs.forEach(item=>{
    const row=document.createElement("div"); row.style.cssText="background:#0f2342;border:1px solid #1a3a6a;border-radius:12px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between";
    row.innerHTML=`<div><b>${item.title}</b><div style="font-size:11px;color:#7fb3ff">${item.desc}</div></div><div style="color:${item.type==='plus'?'#00ff88':'#ff4444'}">${formatRupiah(item.amount)}</div>`;
    container.appendChild(row);
  });
}
function openCheckoutModal(name,id){
  activeService={name,id};
  document.getElementById("checkout-title").textContent="Transaksi: "+name;
  const list=document.getElementById("checkout-nominals-list"); list.innerHTML="";
  let nominals=[];
  if(id.includes("pln")||id.includes("token")) nominals=[{val:"PLN 20K",price:21500},{val:"PLN 50K",price:51500},{val:"PLN 100K",price:101500}];
  else if(id.includes("games")) nominals=[{val:"86 Diamonds",price:21000},{val:"172 Diamonds",price:42000}];
  else nominals=[{val:"Pulsa 10K",price:10800},{val:"Pulsa 25K",price:25400},{val:"Pulsa 50K",price:50200},{val:"Pulsa 100K",price:99800}];
  selectedNominal=nominals[0];
  nominals.forEach((it,i)=>{
    const btn=document.createElement("button"); btn.className="nominal-btn"+(i===0?" selected":""); btn.style.cssText="background:#132a52;border:1px solid #2a5aa0;color:#fff;padding:10px;border-radius:10px;margin:4px;width:100%";
    btn.innerHTML=`${it.val} - ${formatRupiah(it.price)}`;
    btn.onclick=()=>{document.querySelectorAll("#checkout-nominals-list .nominal-btn").forEach(b=>b.classList.remove("selected"));btn.classList.add("selected");selectedNominal=it;};
    list.appendChild(btn);
  });
  document.getElementById("checkout-modal").classList.add("active");
}
function switchTab(id){
  document.querySelectorAll(".tab-content").forEach(el=>el.classList.remove("active"));
  document.querySelectorAll(".nav-item").forEach(b=>b.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  document.querySelector(`[data-tab='${id}']`).classList.add("active");
}
document.querySelectorAll(".nav-item").forEach(btn=>btn.addEventListener("click",()=>switchTab(btn.dataset.tab)));
document.getElementById("act-topup").onclick=()=>document.getElementById("topup-modal").classList.add("active");
document.getElementById("act-mutation").onclick=()=>switchTab("tab-riwayat");
document.getElementById("act-transfer").onclick=()=>document.getElementById("transfer-modal").classList.add("active");
document.getElementById("close-topup-modal").onclick=()=>document.getElementById("topup-modal").classList.remove("active");
document.getElementById("close-transfer-modal").onclick=()=>document.getElementById("transfer-modal").classList.remove("active");
document.getElementById("close-checkout-modal").onclick=()=>document.getElementById("checkout-modal").classList.remove("active");

document.getElementById("btn-submit-topup").onclick=async()=>{
  const amt=parseInt(document.querySelector("#topup-nominals .nominal-btn.selected").dataset.amt)||50000;
  const baru=userBalance+amt;
  await supabase.from('users').update({saldo:baru}).eq('id',USER_ID);
  await supabase.from('transaksi').insert({user_id:USER_ID,jenis:'topup',jumlah:amt,keterangan:'Isi Saldo '+amt});
  userBalance=baru;
  document.getElementById('wallet-balance-display').textContent=formatRupiah(baru);
  document.getElementById("topup-modal").classList.remove("active");
  showToast('Topup REAL +'+formatRupiah(amt)+' ✅'); loadSaldoREAL();
};
document.getElementById("btn-confirm-transaction").onclick=async()=>{
  const cost=selectedNominal.price;
  if(userBalance<cost){showToast('Saldo kurang!');return;}
  const baru=userBalance-cost;
  await supabase.from('users').update({saldo:baru}).eq('id',USER_ID);
  await supabase.from('transaksi').insert({user_id:USER_ID,jenis:'beli',jumlah:-cost,keterangan:activeService.name+' '+selectedNominal.val});
  userBalance=baru;
  document.getElementById('wallet-balance-display').textContent=formatRupiah(baru);
  document.getElementById("checkout-modal").classList.remove("active");
  showToast(activeService.name+' Sukses -'+formatRupiah(cost)+' ✅'); loadSaldoREAL();
};
document.getElementById("btn-submit-transfer").onclick=async()=>{
  const amt=parseInt(document.getElementById("transfer-amount").value);
  if(userBalance<amt){showToast('Saldo kurang');return;}
  const baru=userBalance-amt;
  await supabase.from('users').update({saldo:baru}).eq('id',USER_ID);
  await supabase.from('transaksi').insert({user_id:USER_ID,jenis:'transfer',jumlah:-amt,keterangan:'Transfer ke '+document.getElementById("transfer-target-id").value});
  userBalance=baru;
  document.getElementById('wallet-balance-display').textContent=formatRupiah(baru);
  document.getElementById("transfer-modal").classList.remove("active");
  showToast('Transfer REAL '+formatRupiah(amt)+' ✅'); loadSaldoREAL();
};

// START
renderQuickAccess(); renderCategories(); loadSaldoREAL();
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{});}
</script>
</body>
