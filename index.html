<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REAL FIX 2</title><style>body{font-family:sans-serif;background:#eee;margin:0}.header{background:#EC2028;color:#fff;padding:20px;text-align:center}.card{background:#fff;margin:10px;padding:12px;border-radius:10px}.saldo{font-size:26px;font-weight:bold;color:#EC2028}.btn{background:#EC2028;color:#fff;border:none;padding:12px;width:100%;border-radius:8px}</style></head><body>
<div class="header"><h2>⚡ REAL FIX V2 (FETCH)</h2><p id="status">Connecting...</p></div>
<div class="card"><div class="saldo" id="saldo">Loading...</div><pre id="log" style="font-size:10px;white-space:pre-wrap"></pre><button class="btn" onclick="load()">Refresh</button></div>
<div class="card"><select id="nom"><option value="10000">10rb</option><option value="100000">100rb</option></select><button class="btn" onclick="topup()">+ Tambah</button></div>
<script>
const URL='https://uodyqxumjmgjwfatkvtxu.supabase.co/rest/v1/users?id=eq.IF000004'
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVvZHlxdXhtdWptZ2l3ZmF0a2V0eCIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNzkyNTU0NzY1LCJleHAiOjIxMDgxMzA3NjV9.FDewhDPeeeoXbt-YqYLZ-16BYB_LEEix8GGF_DJNLD8'
async function load(){
 document.getElementById('status').innerText='Loading API...'
 try{
  let r=await fetch(URL,{headers:{'apikey':KEY,'Authorization':'Bearer '+KEY}})
  let j=await r.json()
  document.getElementById('log').innerText='RESP:'+JSON.stringify(j).substring(0,500)+'\nSTATUS:'+r.status
  if(j.length==0){document.getElementById('saldo').innerText='USER TIDAK ADA - INSERT DULU';return}
  document.getElementById('saldo').innerText='Rp '+(j[0].saldo||0).toLocaleString()
  document.getElementById('status').innerText='CONNECTED OK'
 }catch(e){document.getElementById('log').innerText='FETCH ERR:'+e}
}
async function topup(){
 let nom=parseInt(document.getElementById('nom').value)
 let r=await fetch(URL,{headers:{'apikey':KEY,'Authorization':'Bearer '+KEY}})
 let j=await r.json()
 let saldo=(j[0]?.saldo||0)+nom
 await fetch('https://uodyqxumjmgjwfatkvtxu.supabase.co/rest/v1/users?id=eq.IF000004',{method:'PATCH',headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify({saldo:saldo})})
 alert('Topup OK jadi '+saldo);load()
}
load()
</script></body></html>
