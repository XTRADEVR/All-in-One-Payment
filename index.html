<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>All in One Pay - REAL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:system-ui;padding:16px}
.card{background:#161616;border:1px solid #2a2a2a;border-radius:16px;padding:16px;margin-bottom:16px}
.saldo{font-size:32px;font-weight:800;color:#00ff88}
.btn{padding:12px 18px;border-radius:12px;border:0;font-weight:700;cursor:pointer}
.btn-green{background:#00ff88;color:#000}
input{width:100%;padding:14px;border-radius:12px;background:#0f0f0f;border:1px solid #333;color:#fff;margin:8px 0}
.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700}
.ok{background:#00ff88;color:#000} .bad{background:#ff3b3b;color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{background:#1e1e1e;border:1px solid #333;border-radius:12px;padding:12px;text-align:left;cursor:pointer}
</style>
</head>
<body>
<h2>💳 All in One Pay - REAL</h2>
<div id="status" class="badge bad" style="margin:8px 0">Checking...</div>

<div id="keyBox" class="card" style="display:none">
<h3>🔑 Masukkan Publishable Key</h3>
<p style="color:#888;font-size:13px">Supabase > Project Settings > Data API > Copy Publishable Key (sb_publishable_...)</p>
<input id="keyInput" placeholder="sb_publishable_...">
<button class="btn btn-green" style="width:100%" onclick="saveKey()">Simpan & Jadi REAL</button>
</div>

<div class="card">
<div style="color:#888;font-size:12px">ID: IF000004 • <span id="mode">OFFLINE</span></div>
<div class="saldo" id="saldo">Rp ...</div>
</div>

<div class="card">
<h3>Topup</h3>
<div class="grid">
<button class="item" onclick="topup(10000)">+10rb</button>
<button class="item" onclick="topup(50000)">+50rb</button>
<button class="item" onclick="topup(100000)">+100rb</button>
<button class="item" onclick="resetSaldo()">Reset 0</button>
</div>
</div>

<div class="card">
<h3>Beli</h3>
<div class="grid">
<button class="item" onclick="beli(6500,'Tsel 5rb')">Tsel 5rb<br><small>Rp 6.500</small></button>
<button class="item" onclick="beli(12000,'Tsel 10rb')">Tsel 10rb<br><small>Rp 12.000</small></button>
<button class="item" onclick="beli(21000,'XL 20rb')">XL 20rb<br><small>Rp 21.000</small></button>
<button class="item" onclick="beli(55000,'PLN 50rb')">PLN 50rb<br><small>Rp 55.000</small></button>
</div>
<div id="log" style="margin-top:12px;color:#00ff88;font-size:12px"></div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const URL = 'https://uodyquxmujmgiwfatkeh.supabase.co';
let KEY = localStorage.getItem('sb_publishable_key') || '';
const USER_ID = 'IF000004';
const statusEl = document.getElementById('status');
const keyBox = document.getElementById('keyBox');
const saldoEl = document.getElementById('saldo');
const modeEl = document.getElementById('mode');
function checkKey(){
  if(!KEY || !KEY.startsWith('sb_publishable_')){
    statusEl.innerText = 'Butuh Publishable Key';
    keyBox.style.display='block';
    modeEl.innerText='OFFLINE - No Key';
    let s = parseInt(localStorage.getItem('offline_saldo_'+USER_ID) || '3500');
    saldoEl.innerText='Rp '+s.toLocaleString('id-ID');
    return false;
  }
  keyBox.style.display='none';
  return true;
}
window.saveKey = ()=>{
  const v = document.getElementById('keyInput').value.trim();
  if(!v.startsWith('sb_publishable_')){alert('Key harus sb_publishable_');return}
  localStorage.setItem('sb_publishable_key', v);
  KEY = v;
  location.reload();
}
let supabase = null;
let REAL = false;
async function init(){
  if(!checkKey()) return;
  supabase = createClient(URL, KEY);
  statusEl.innerText='Menghubungkan...';
  try{
    const { data, error } = await supabase.from('users').select('saldo').eq('id', USER_ID).maybeSingle();
    if(error) throw error;
    if(!data){
      await supabase.from('users').insert({id:USER_ID, saldo:3500});
      saldoEl.innerText='Rp 3.500';
    } else {
      saldoEl.innerText='Rp '+Number(data.saldo).toLocaleString('id-ID');
    }
    REAL = true;
    statusEl.innerText='REAL Supabase ✅';
    statusEl.className='badge ok';
    modeEl.innerText='REAL Supabase ✅';
  }catch(err){
    statusEl.innerText='Failed: '+err.message;
    statusEl.className='badge bad';
  }
}
window.topup = async(n)=>{
  if(!REAL){let cur=parseInt(localStorage.getItem('offline_saldo_'+USER_ID)||'3500');cur+=n;localStorage.setItem('offline_saldo_'+USER_ID,cur);saldoEl.innerText='Rp '+cur.toLocaleString('id-ID');return;}
  const { data } = await supabase.from('users').select('saldo').eq('id',USER_ID).single();
  const baru = Number(data.saldo)+n;
  await supabase.from('users').update({saldo:baru}).eq('id',USER_ID);
  saldoEl.innerText='Rp '+baru.toLocaleString('id-ID');
}
window.beli = async(harga,nama)=>{
  const curData = REAL ? (await supabase.from('users').select('saldo').eq('id',USER_ID).single()).data : {saldo: parseInt(localStorage.getItem('offline_saldo_'+USER_ID)||'3500')};
  if(Number(curData.saldo)<harga){alert('Saldo kurang');return}
  if(!REAL){let cur=Number(curData.saldo)-harga;localStorage.setItem('offline_saldo_'+USER_ID,cur);saldoEl.innerText='Rp '+cur.toLocaleString('id-ID');return;}
  const baru = Number(curData.saldo)-harga;
  await supabase.from('users').update({saldo:baru}).eq('id',USER_ID);
  saldoEl.innerText='Rp '+baru.toLocaleString('id-ID');
}
window.resetSaldo = async()=>{
  if(!REAL){localStorage.setItem('offline_saldo_'+USER_ID,'0');saldoEl.innerText='Rp 0';return;}
  await supabase.from('users').update({saldo:0}).eq('id',USER_ID);
  saldoEl.innerText='Rp 0';
}
init();
</script>
</body>
  </html>
